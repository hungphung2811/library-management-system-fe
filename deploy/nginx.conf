# Web (FE tĩnh) + proxy cùng origin tới cổng vào `nginx` (8080) của compose. Cùng origin nên /api không cần CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location ~ ^/(api|public)/ {
        proxy_pass http://nginx:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Tệp băm tên (Vite) cache lâu; index.html không cache để bản mới có hiệu lực ngay
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri /index.html; }   # SPA fallback (react-router)
}
